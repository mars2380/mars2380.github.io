name: Run Job
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: 
  push:
    branches:
      - main
    # paths-ignore:
    #   - index.html
    #   - jobs_data.json
  schedule:
    - cron: "*/20 7-22 * * *"

concurrency:
  group: jobserve-main-updater
  cancel-in-progress: true
    
permissions:
  contents: write

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"

      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

      - run: echo "🖥️ The workflow is now ready to test your code on the runner."

      - name: List files in the repository
        run: |
          rm -v index.html  || true
          rm -v jobs_data.json || true
          ls ${{ github.workspace }}

      - name: Check Python version
        run: |
          python --version

      - name: Install Python dependency
        run: |
          pip install -r requirements.txt

      - name: Run Python Job
        run: |
          # python jobs.py | tee index.html
          python3 jobserve_scraper.py --output-html index.html

      - name: Commit & Push changes
        run: |
          ls -l
          git status
          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote -v
          git add index.html jobs_data.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update index.html"
          echo "Push"
          git remote set-url --push origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          # Handle concurrent updates to main without rebase conflicts on generated files.
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt ${i}"
              break
            fi
            git fetch origin main
            git merge --no-edit -X ours origin/main
            if [ "$i" -eq 3 ]; then
              echo "Push failed after 3 attempts"
              exit 1
            fi
            echo "Push failed on attempt ${i}; retrying..."
          done

      - run: echo "🍏 This job's status is ${{ job.status }}."